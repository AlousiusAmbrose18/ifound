name: ifound
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ifound
      MYSQL_USER: ifound
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u ifound -D ifound -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ifound?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ifound
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    networks: [data, app]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/q/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  frontend:
    build: .
    environment:
      BACKEND_URL: http://backend:8080
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  mysql-data:
networks:
  app:
  data:
    internal: true
